name: IntervalEar
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja, ko, de, es, fr, pt-BR, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.intervalear
    APP_STORE_ID: "6837715340"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  IntervalEar:
    type: application
    platform: iOS
    sources: [IntervalEar, Shared]
    dependencies:
      - target: IntervalEarWidget
        embed: true
        link: false
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: IntervalEar/IntervalEar.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: IntervalEar AppStore
    info:
      path: IntervalEar/Info.plist
      properties:
        CFBundleDisplayName: TwoNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleDocumentTypes:
          - CFBundleTypeName: TwoNote Set
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.intervalear.set]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.intervalear.set
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [intervalset]
        LSSupportsOpeningDocumentsInPlace: true
  IntervalEarWidget:
    type: app-extension
    platform: iOS
    sources: [IntervalEarWidget, Shared/ActivityState.swift, Shared/L10n.swift, Shared/Localizable.xcstrings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: IntervalEarWidget/IntervalEarWidget.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: IntervalEar Widget AppStore
    info:
      path: IntervalEarWidget/Info.plist
      properties:
        CFBundleDisplayName: TwoNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  IntervalEarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntervalEarTests, Shared, IntervalEar/ShareFiles.swift]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  IntervalEarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IntervalEarUITests]
    dependencies:
      - target: IntervalEar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IntervalEar
schemes:
  IntervalEar:
    build:
      targets:
        IntervalEar: all
        IntervalEarTests: [test]
    test:
      config: Debug
      targets: [IntervalEarTests]
  IntervalEarUI:
    build:
      targets:
        IntervalEar: all
        IntervalEarUITests: [test]
    test:
      config: Debug
      targets: [IntervalEarUITests]
